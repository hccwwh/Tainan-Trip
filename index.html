<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11/14 - 11/15 台南兩天一夜親子歡樂順遊</title>
  <style>
    :root {
      --peach-main: #FF8A65;
      --peach-dark: #F4511E;
      --peach-light: #FFF3E0;
      --peach-soft: #FFCCBC;
      
      --sky-main: #4FC3F7;
      --sky-dark: #0288D1;
      --sky-light: #E1F5FE;
      --sky-soft: #B3E5FC;

      --mint-accent: #66BB6A;
      --mint-light: #E8F5E9;
      --purple-night: #9575CD;
      --purple-light: #EDE7F6;

      --bg-cream: #FFFDF9;
      --card-bg: #FFFFFF;
      --text-main: #4E342E;
      --text-sub: #6D4C41;
      --text-muted: #A1887F;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-cream);
      background-image: 
        radial-gradient(var(--peach-soft) 1.5px, transparent 1.5px),
        radial-gradient(var(--sky-soft) 1.5px, var(--bg-cream) 1.5px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      color: var(--text-main);
      line-height: 1.65;
      padding: 20px 16px 64px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, #FF9A76 0%, #FFB74D 50%, #4FC3F7 100%);
      color: #FFFFFF;
      padding: 26px 22px;
      border-radius: 24px;
      margin-bottom: 22px;
      box-shadow: 0 8px 0 rgba(244, 81, 30, 0.2), 0 12px 20px rgba(0, 0, 0, 0.08);
      border: 3px solid #FFFFFF;
      position: relative;
      overflow: hidden;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.15);
    }

    header p {
      font-size: 0.94rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.22);
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 22px;
    }

    .tab-btn {
      padding: 12px 6px;
      font-size: 0.92rem;
      font-weight: 800;
      border: 2px solid var(--sky-main);
      border-radius: 16px;
      background: #FFFFFF;
      color: var(--sky-dark);
      cursor: pointer;
      box-shadow: 0 4px 0 var(--sky-soft);
      transition: all 0.15s ease;
      text-align: center;
    }

    .tab-btn:hover {
      transform: translateY(-2px);
    }

    .tab-btn.active {
      background: var(--peach-main);
      border-color: var(--peach-dark);
      color: #FFFFFF;
      box-shadow: 0 4px 0 var(--peach-dark);
      transform: translateY(1px);
    }

    .day-content {
      display: none;
      animation: popIn 0.25s ease;
    }

    .day-content.active {
      display: block;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 34px;
    }

    .card {
      background: var(--card-bg);
      border: 2px solid var(--sky-soft);
      border-radius: 22px;
      padding: 20px 22px;
      box-shadow: 0 6px 0 var(--sky-light), 0 8px 16px rgba(79, 195, 247, 0.08);
      transition: transform 0.2s;
    }

    .card.peach-card {
      border-color: var(--peach-soft);
      box-shadow: 0 6px 0 var(--peach-light), 0 8px 16px rgba(255, 138, 101, 0.08);
    }

    .badge {
      display: inline-block;
      background: var(--sky-light);
      color: var(--sky-dark);
      font-weight: 800;
      font-size: 0.85rem;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 10px;
      border: 1.5px solid var(--sky-soft);
    }

    .badge.food {
      background: var(--mint-light);
      color: #2E7D32;
      border-color: #C8E6C9;
    }

    .badge.hotel {
      background: var(--peach-light);
      color: var(--peach-dark);
      border-color: var(--peach-soft);
    }

    .badge.night {
      background: var(--purple-light);
      color: #5E35B1;
      border-color: #D1C4E9;
    }

    .card h2 {
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .card p {
      font-size: 0.95rem;
      color: var(--text-sub);
      margin-bottom: 14px;
    }

    .card p:last-child {
      margin-bottom: 0;
    }

    .meta-box {
      background: #F4FBFE;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 0.88rem;
      color: var(--text-main);
      border: 1.5px dashed var(--sky-main);
    }

    .meta-box.peach-box {
      background: #FFF9F5;
      border-color: var(--peach-main);
    }

    .meta-box.food-box {
      background: #F6FBF6;
      border-color: var(--mint-accent);
    }

    .meta-row {
      margin-bottom: 4px;
    }

    .meta-row:last-child {
      margin-bottom: 0;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      font-size: 0.88rem;
      font-weight: 700;
      border-radius: 12px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }

    .btn:active {
      transform: translateY(2px);
    }

    .btn-map {
      background-color: var(--sky-main);
      color: #FFFFFF;
      box-shadow: 0 3px 0 var(--sky-dark);
    }

    .btn-peach {
      background-color: var(--peach-main);
      color: #FFFFFF;
      box-shadow: 0 3px 0 var(--peach-dark);
    }

    .btn-food {
      background-color: var(--mint-accent);
      color: #FFFFFF;
      box-shadow: 0 3px 0 #388E3C;
    }

    .btn-copy {
      background-color: var(--peach-light);
      color: var(--peach-dark);
      box-shadow: 0 3px 0 var(--peach-soft);
    }

    .section-title {
      font-size: 1.22rem;
      font-weight: 800;
      margin-bottom: 14px;
      padding: 6px 14px;
      background: var(--peach-light);
      color: var(--peach-dark);
      border-radius: 14px;
      display: inline-block;
      border: 2px solid var(--peach-soft);
    }

    .table-wrap {
      overflow-x: auto;
      background: var(--card-bg);
      border-radius: 20px;
      border: 2px solid var(--peach-soft);
      box-shadow: 0 6px 0 var(--peach-light);
      margin-bottom: 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: left;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1.5px dashed var(--peach-soft);
    }

    th {
      background-color: var(--peach-light);
      font-weight: 800;
      color: var(--peach-dark);
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .checklist-group {
      margin-bottom: 20px;
    }

    .checklist-group:last-child {
      margin-bottom: 0;
    }

    .checklist-group h3 {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--peach-dark);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 2px dashed var(--peach-soft);
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: #F4FBFE;
      border: 1.5px solid var(--sky-soft);
      border-radius: 14px;
      margin-bottom: 8px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }

    .check-item:hover {
      background: var(--sky-light);
    }

    .check-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--peach-main);
      cursor: pointer;
    }

    .check-item.checked {
      background: #F5F5F5;
      border-color: #E0E0E0;
    }

    .check-item.checked span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .highlight-tag {
      background: var(--peach-main);
      color: #FFFFFF;
      font-size: 0.76rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 6px;
      display: inline-block;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--peach-dark);
      color: #FFFFFF;
      font-weight: 700;
      padding: 12px 22px;
      border-radius: 20px;
      font-size: 0.92rem;
      box-shadow: 0 6px 16px rgba(244, 81, 30, 0.3);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🧸 台南兩天一夜親子歡樂順遊</h1>
    <p>🚗 11/14 海岸線×新市×永大夜市 ➔ 11/15 玩到12點退房×餵魚去！</p>

    <!-- 
    ====================================================================
    【備用區塊：日本時間時鐘】
    目前已經幫你註解隱藏起來，若未來需要顯示，只要把外層的註解符號拿掉即可。
    ====================================================================
    <div id="jp-clock-box" style="margin-top: 12px; padding-top: 10px; border-top: 1.5px dashed rgba(255,255,255,0.5); font-size: 0.9rem; font-weight: 700;">
      🇯🇵 日本標準時間 (JST)：<span id="jp-time">--:--:--</span>
    </div>
    -->
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('day1', this)">🎈 Day 1</button>
    <button class="tab-btn" onclick="switchTab('day2', this)">🎠 Day 2</button>
    <button class="tab-btn" onclick="switchTab('lunch', this)">🥗 蔬食午餐</button>
    <button class="tab-btn" onclick="switchTab('packing', this)">🎒 打包清單</button>
  </div>

  <!-- ==================== DAY 1 ==================== -->
  <div id="day1" class="day-content active">
    <div class="timeline">
      <div class="card">
